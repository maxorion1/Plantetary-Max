name = "portal-os"
main = "dist/index.js"
compatibility_date = "2024-09-07"
workers_dev = true

[durable_objects]
bindings = [
  { name = "SubstrateDO", class_name = "SubstrateDO" },
  { name = "BrokerDO", class_name = "BrokerDO" }
]

[exports.SubstrateDO]
type = "durable-object"
storage = "sqlite"

[exports.BrokerDO]
type = "durable-object"
storage = "sqlite"

migrations = [
  { 
    tag = "v1",
    new_classes = ["SubstrateDO", "BrokerDO"]
  }
]
