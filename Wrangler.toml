name = "portal-os"
main = "dist/index.js"
compatibility_date = "2024-09-06"

account_id = "b4555c974c0c85aaab4295cd5d6cb74f"
workers_dev = true

routes = [
  { pattern = "portal-os.max-orion1.workers.dev/*", script = "portal-os" }
]

[build]
command = "npm run build"
cwd = "."

[durable_objects]
bindings = [
  { name = "SubstrateDO", class_name = "SubstrateDO" },
  { name = "BrokerDO", class_name = "BrokerDO" }
]

migrations = [
  { tag = "v1", new_classes = ["SubstrateDO", "BrokerDO"] }
]

[[kv_namespaces]]
binding = "PORTAL_KV"
id = "your_kv_id_here"

[[r2_buckets]]
binding = "PORTAL_BUCKET"
bucket_name = "portal-bucket"
