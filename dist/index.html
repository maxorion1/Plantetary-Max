<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portal‑OS Dashboard</title>

    body { margin: 0; background: #0d0d0d; color: #eaeaea; font-family: Arial, sans-serif; }
    #app { padding: 40px; }
    h1 { font-size: 32px; margin-bottom: 20px; }
    .panel { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Portal‑OS Runtime</h1>
    <div class="panel">
      <p>Durable Objects Active:</p>
      <ul>
        <li>SubstrateDO</li>
        <li>BrokerDO</li>
      </ul>
    </div>
    <div class="panel">
      <p>Runtime Status: Online</p>
    </div>
  </div>
</body>
</html>
